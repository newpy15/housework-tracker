<!doctype html>
<html lang="ko" data-skin="mint">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>집안일 기록장</title>
<meta name="theme-color" content="#e9f5f1" id="themeColor">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="집안일">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Skins: 4 color/background/music sets, switched by html[data-skin]. Layout: big calendar, tap a date → bottom sheet. */
:root, html[data-skin="mint"] {
  --bg: #eef6f3; --page: radial-gradient(circle at 10% 4%, rgba(255, 246, 196, .85), transparent 28%), linear-gradient(165deg, #d9efe8 0%, #f0f7f1 55%, #d3e9df 100%);
  --surface-rgb: 255, 255, 255; --surface: rgba(var(--surface-rgb), var(--alpha, .62)); --fg: #1c2a2a; --muted: #667573; --line: #dde4e2;
  --accent: #1f7a6d; --accent-fg: #ffffff; --accent-soft: #dff0ec; --sun: #c8452f; --sat: #3b6fb0;
  --f-display: "Do Hyeon", "Noto Sans KR", sans-serif;
  --f-body: "Noto Sans KR", system-ui, sans-serif;
  color-scheme: light;
}
html[data-skin="cream"] {
  --bg: #f8eedd; --page: linear-gradient(165deg, #fbeed6 0%, #f4dcbd 60%, #efcfa8 100%);
  --surface-rgb: 255, 250, 241; --fg: #3a2a1c; --muted: #8a7560; --line: #e8d7bf;
  --accent: #b45f27; --accent-fg: #ffffff; --accent-soft: #f6dcc3; --sun: #c0392b; --sat: #3b6fb0;
}
html[data-skin="night"] {
  --bg: #121835;
  --page: radial-gradient(circle at 84% 9%, #fff6d6 0 13px, rgba(255, 244, 200, .3) 14px 34px, rgba(255, 244, 200, .08) 35px 90px, transparent 91px), linear-gradient(170deg, #070b1f 0%, #141a48 60%, #232266 100%);
  --surface-rgb: 24, 31, 70; --fg: #e8ebff; --muted: #9ba5d6; --line: #2e376e;
  --accent: #a0acff; --accent-fg: #0b1030; --accent-soft: #2c3578; --sun: #ff9d8c; --sat: #8fb8ff;
  color-scheme: dark;
}
html[data-skin="forest"] {
  --bg: #e4efe7;
  --page: radial-gradient(130% 34% at 15% 104%, #5d9473 0 62%, transparent 63%), radial-gradient(120% 30% at 88% 106%, #3f7a59 0 62%, transparent 63%), linear-gradient(180deg, #c3d7cb 0%, #b2cfbd 55%, #9fc3ae 100%);
  --surface-rgb: 246, 253, 248; --fg: #15301f; --muted: #52705c; --line: #c3d9ca;
  --accent: #2b7a4b; --accent-fg: #ffffff; --accent-soft: #cde5d4; --sun: #b8432f; --sat: #2f6aa8;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; min-height: 100%; background-color: var(--bg); background-image: var(--page); background-attachment: fixed; transition: background-color .4s; }
button, .day { touch-action: manipulation; }
body {
  margin: 0;
  min-height: 100vh; min-height: 100dvh;
  color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding-top: max(20px, env(safe-area-inset-top, 0px));
  padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* background decoration (behind everything) */
body::before, body::after { content: ''; position: fixed; z-index: -1; pointer-events: none; display: none; }
/* 사진 배경: backgrounds/<스킨>.jpg 또는 사용자가 고른 사진. 있으면 일러스트와 장식을 대신함 */
.photo { --dim: .06; position: fixed; inset: 0; z-index: -2; display: none; pointer-events: none; background-size: cover; background-position: center; background-repeat: no-repeat; }
html[data-skin="night"] .photo { --dim: .3; }
html[data-skin="forest"] .photo { --dim: .1; }
html[data-photo] .photo { display: block; }
html[data-photo] .scene svg { display: none !important; }
html[data-photo] body::before, html[data-photo] body::after { display: none !important; }

/* 스킨별 풍경 일러스트 (SVG). 화면 아래에 맞춰 크게 깔고 살짝 움직임 */
.scene svg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -2; display: none; pointer-events: none; }
html[data-skin="mint"] .sc-mint, html[data-skin="cream"] .sc-cream, html[data-skin="night"] .sc-night, html[data-skin="forest"] .sc-forest { display: block; }
.cl1 { animation: cloud 48s ease-in-out infinite alternate; }
.cl2 { animation: cloud 62s ease-in-out infinite alternate-reverse; }
.cl3 { animation: cloud 75s ease-in-out infinite alternate; }
.glow { animation: glow 6s ease-in-out infinite alternate; }
.leaf { transform-origin: 316px 380px; animation: leaf 5s ease-in-out infinite alternate; }
.steam { animation: steam 4s ease-in-out infinite; }
.steam.s2 { animation-delay: -2s; }
.beam { animation: sway 14s ease-in-out infinite alternate; }
.beam.b2 { animation-duration: 19s; animation-direction: alternate-reverse; }
.ff { animation: ff 5s ease-in-out infinite; }
.ff.f2 { animation-delay: -1s; } .ff.f3 { animation-delay: -2s; } .ff.f4 { animation-delay: -3s; } .ff.f5 { animation-delay: -4s; } .ff.f6 { animation-delay: -2.5s; }
.shoot { opacity: 0; animation: shoot 14s linear infinite; }
.fog { animation: fog 30s ease-in-out infinite alternate; }
.fog.f2 { animation-duration: 38s; animation-direction: alternate-reverse; }
html[data-skin="night"] body::before, html[data-skin="night"] body::after {
  display: block; inset: 0;
  background-image: radial-gradient(1.6px 1.6px at 20px 30px, #fff, transparent), radial-gradient(1px 1px at 90px 60px, #fff, transparent), radial-gradient(1.6px 1.6px at 150px 120px, #cfd8ff, transparent), radial-gradient(1px 1px at 60px 160px, #fff, transparent), radial-gradient(1.2px 1.2px at 190px 190px, #e6e9ff, transparent);
  background-size: 220px 220px; animation: twinkle 4s ease-in-out infinite;
}
html[data-skin="night"] body::after { background-size: 290px 290px; background-position: 70px 40px; animation-duration: 6s; animation-delay: -2s; }
html[data-skin="forest"] body::before, html[data-skin="forest"] body::after {
  display: block; left: 0; right: 0; top: -140px; bottom: 0; opacity: .6;
  background: repeating-linear-gradient(90deg, transparent 0 23px, rgba(43, 122, 75, .45) 23px 24.5px);
  -webkit-mask-image: repeating-linear-gradient(180deg, #000 0 26px, transparent 26px 70px);
  mask-image: repeating-linear-gradient(180deg, #000 0 26px, transparent 26px 70px);
  animation: rain .9s linear infinite;
}
html[data-skin="forest"] body::after {
  background: repeating-linear-gradient(90deg, transparent 0 37px, rgba(43, 122, 75, .35) 37px 38.2px);
  -webkit-mask-image: repeating-linear-gradient(180deg, #000 0 18px, transparent 18px 83px);
  mask-image: repeating-linear-gradient(180deg, #000 0 18px, transparent 18px 83px);
  animation: rain2 1.3s linear infinite;
}
@keyframes cloud { from { transform: translateX(-40px); } to { transform: translateX(60px); } }
@keyframes glow { from { opacity: .7; } to { opacity: 1; } }
@keyframes leaf { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
@keyframes steam { 0% { opacity: 0; transform: translateY(6px); } 50% { opacity: .75; } 100% { opacity: 0; transform: translateY(-10px); } }
@keyframes sway { from { opacity: .55; transform: translateX(-4%); } to { opacity: 1; transform: translateX(4%); } }
@keyframes ff { 0%, 100% { opacity: .1; transform: translate(0, 0); } 50% { opacity: 1; transform: translate(8px, -10px); } }
@keyframes shoot { 0% { opacity: 0; transform: translate(0, 0); } 2% { opacity: 1; } 8% { opacity: 0; transform: translate(-170px, 95px); } 100% { opacity: 0; } }
@keyframes fog { from { transform: translateX(-40px); } to { transform: translateX(40px); } }
@keyframes twinkle { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
@keyframes rain { to { transform: translateY(70px); } }
@keyframes rain2 { to { transform: translateY(83px); } }
@media (prefers-reduced-motion: reduce) { body::before, body::after, .scene * { animation: none !important; } }

main {
  max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px;
  /* 첫 화면에서 달력이 남는 높이를 모두 차지하도록 */
  min-height: calc(100vh - 40px);
  min-height: calc(100dvh - max(20px, env(safe-area-inset-top, 0px)) - max(16px, env(safe-area-inset-bottom, 0px)));
}
h1 { font-family: var(--f-display); font-weight: 400; font-size: 24px; margin: 0; line-height: 1.1; white-space: nowrap; }
button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tools { display: flex; align-items: center; gap: 6px; }
.ibtn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 18px; line-height: 1; padding: 0; }
.ibtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }

/* --- calendar --- */
.seg { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 2px; }
.seg button { min-height: 34px; padding: 0 14px; border: 0; border-radius: 8px; background: none; font-size: 14px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.cal { flex: 1; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; touch-action: pan-y; -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
#calBody { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.cal-title { font-family: var(--f-display); font-size: 20px; }
.nav { display: flex; gap: 4px; align-items: center; }
.nav button { min-width: 40px; min-height: 40px; border-radius: 10px; border: 1px solid var(--line); background: none; font-size: 16px; }
.nav .today-btn { padding: 0 12px; font-size: 13px; font-weight: 700; }

/* month grid */
.dows, .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.grid { flex: 1; grid-auto-rows: minmax(0, 1fr); }
.dow { text-align: center; font-size: 13px; color: var(--muted); padding: 2px 0 8px; }
.dow:first-child, .day.sun .num { color: var(--sun); }
.dow:nth-child(7), .day.sat .num { color: var(--sat); }
.day { min-height: 0; border: 0; background: none; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 6px; padding-top: 10px; font-variant-numeric: tabular-nums; font-size: 17px; transition: background-color .2s, color .2s; }
.day.blank { visibility: hidden; }
.day.part { background: var(--accent-soft); }
.day.done { background: var(--accent); color: var(--accent-fg); }
.day.done .num { color: var(--accent-fg); }
.day.today .num { font-weight: 700; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 2px; }
.day.sel { box-shadow: 0 0 0 2px var(--fg); }
.dots { display: flex; gap: 3px; height: 7px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--muted); }
.dots i.d { background: var(--accent); box-shadow: none; }
.day.done .dots i.d { background: var(--accent-fg); }

/* week rows */
.week { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.wrow { flex: 1; display: flex; align-items: center; gap: 10px; width: 100%; min-height: 56px; text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px; transition: background-color .2s, border-color .2s; }
.wrow.part { background: var(--accent-soft); }
.wrow.done { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.wrow.sel { box-shadow: 0 0 0 2px var(--fg); }
.wdate { flex: none; width: 36px; text-align: center; line-height: 1.15; }
.wdate b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 20px; }
.wdate span { font-size: 12px; color: var(--muted); }
.wrow.sun .wdate span, .wrow.sun .wdate b { color: var(--sun); }
.wrow.sat .wdate span, .wrow.sat .wdate b { color: var(--sat); }
.wrow.done .wdate span, .wrow.done .wdate b { color: var(--accent-fg); }
.wrow.today .wdate b { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 2px; }
.chips { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-size: 12.5px; padding: 1px 9px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); overflow-wrap: anywhere; }
.chip.d { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.wrow.done .chip.d { background: var(--accent-fg); border-color: var(--accent-fg); color: var(--accent); }
.none { font-size: 13px; color: var(--muted); }
.wrow.done .none { color: var(--accent-fg); }

/* --- bottom sheets (day / skin) --- */
.scrim { position: fixed; inset: 0; z-index: 10; background: rgba(0, 0, 0, .4); opacity: 0; visibility: hidden; transition: opacity .25s, visibility .25s; }
.scrim.open { opacity: 1; visibility: visible; }
.scrim.lite { background: rgba(0, 0, 0, .06); }   /* 꾸미기 창: 달력이 바로 보이게 */
.sheet {
  position: fixed; z-index: 20; bottom: 0; left: 50%; width: min(100%, 520px); max-height: 88vh; max-height: 88dvh; overflow-y: auto; overscroll-behavior: contain;
  transform: translate(-50%, 100%); visibility: hidden; transition: transform .3s cubic-bezier(.2, .8, .2, 1), visibility .3s;
  background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-bottom: 0; border-radius: 22px 22px 0 0;
  padding: 8px 14px max(18px, env(safe-area-inset-bottom, 0px)); box-shadow: 0 -8px 30px rgba(0, 0, 0, .18);
  display: flex; flex-direction: column; gap: 10px;
}
.sheet.open { transform: translate(-50%, 0); visibility: visible; }
.grab { align-self: center; width: 40px; height: 4px; border-radius: 99px; background: var(--line); flex: none; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.ph-text { min-width: 0; }
.ph-btns { display: flex; gap: 4px; flex: none; }
.ph-btns button { min-width: 40px; min-height: 40px; border-radius: 10px; border: 1px solid var(--line); background: none; font-size: 16px; }
.panel-head h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 20px; }
.count { font-size: 13px; color: var(--muted); }
.bar { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.item { display: flex; align-items: center; gap: 8px; }
.check { flex: 1; min-width: 0; min-height: 54px; display: flex; align-items: center; gap: 12px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px 12px; transition: background-color .2s, border-color .2s, color .2s; }
.check[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.box { flex: none; width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--muted); display: grid; place-items: center; font-size: 16px; line-height: 1; color: transparent; transition: background-color .2s, border-color .2s; }
.check[aria-pressed="true"] .box { background: var(--accent-fg); border-color: var(--accent-fg); color: var(--accent); }
.txt { flex: 1; min-width: 0; }
.name { font-weight: 700; overflow-wrap: anywhere; }
.check[aria-pressed="true"] .name { text-decoration: line-through; text-decoration-thickness: 1.5px; }
.last { font-size: 12.5px; color: var(--muted); }
.check[aria-pressed="true"] .last { color: var(--accent-fg); opacity: .85; }
.del { flex: none; min-width: 44px; min-height: 44px; padding: 0 8px; border-radius: 10px; border: 1px solid var(--line); background: none; font-size: 13px; color: var(--muted); }
.del.sure { color: var(--sun); border-color: var(--sun); }
.add { display: flex; gap: 8px; }
input[type="text"] { font: inherit; font-size: 16px; /* 16px 미만이면 iOS가 입력 시 화면을 확대함 */ color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-height: 44px; min-width: 0; flex: 1; }
.add button { flex: none; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-fg); font-weight: 700; }
.sugg { display: flex; flex-wrap: wrap; gap: 6px; }
.sugg button { min-height: 34px; padding: 0 12px; border-radius: 99px; border: 1px dashed var(--muted); background: none; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 14px; }

/* skin picker */
.skins { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.skin { text-align: left; padding: 8px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 6px; }
.skin[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.sw { height: 64px; border-radius: 9px; display: grid; place-items: center; font-size: 28px; }
.skin b { font-size: 15px; }
.skin small { display: block; font-size: 12px; color: var(--muted); line-height: 1.3; }
.music { display: flex; align-items: center; gap: 12px; }
.mbtn { flex: none; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; }
.mbtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.music input[type="range"], .opac input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); }
.opac { display: flex; align-items: center; gap: 12px; }
.opac label { flex: none; font-size: 14px; font-weight: 700; white-space: nowrap; }
.opac b { display: inline-block; min-width: 2.2em; text-align: right; font-variant-numeric: tabular-nums; color: var(--accent); }
.photo-row { display: flex; flex-wrap: wrap; gap: 8px; }
.hint { margin: 0; font-size: 12px; color: var(--muted); }

.toast { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); top: calc(16px + env(safe-area-inset-top, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px); }
</style>
</head>
<body>

<main>
  <div class="top">
    <h1>집안일 기록장</h1>
    <div class="tools">
      <button type="button" class="ibtn" id="skinBtn" aria-label="꾸미기 (배경·음악)">🎨</button>
      <button type="button" class="ibtn" id="soundBtn" aria-pressed="false" aria-label="배경음악 켜기">🔇</button>
      <div class="seg" role="group" aria-label="보기 방식">
        <button type="button" id="mWeek" aria-pressed="false">주</button>
        <button type="button" id="mMonth" aria-pressed="true">월</button>
      </div>
    </div>
  </div>

  <section class="cal" id="cal" aria-label="달력">
    <div class="cal-head">
      <div class="cal-title" id="calTitle"></div>
      <div class="nav">
        <button type="button" id="prev" aria-label="이전">‹</button>
        <button type="button" id="todayBtn" class="today-btn">오늘</button>
        <button type="button" id="next" aria-label="다음">›</button>
      </div>
    </div>
    <div id="calBody"></div>
  </section>
</main>

<div class="photo" id="photo" aria-hidden="true"></div>
<div class="scene" aria-hidden="true">

  <!-- 🌿 민트: 아침 언덕 -->
  <svg class="sc sc-mint" viewBox="0 0 400 800" preserveAspectRatio="xMidYMax slice">
    <defs>
      <linearGradient id="mSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9e5dd"/><stop offset=".5" stop-color="#e6f5ec"/><stop offset="1" stop-color="#fff4d6"/></linearGradient>
      <radialGradient id="mSun"><stop offset="0" stop-color="#fff6c4" stop-opacity=".95"/><stop offset="1" stop-color="#fff6c4" stop-opacity="0"/></radialGradient>
    </defs>
    <rect width="400" height="800" fill="url(#mSky)"/>
    <circle class="glow" cx="320" cy="118" r="130" fill="url(#mSun)"/>
    <circle cx="320" cy="118" r="38" fill="#fff3b0"/>
    <g class="cl cl1" fill="#fff" opacity=".9"><ellipse cx="86" cy="150" rx="46" ry="13"/><ellipse cx="116" cy="139" rx="30" ry="16"/><ellipse cx="58" cy="141" rx="24" ry="11"/></g>
    <g class="cl cl2" fill="#fff" opacity=".8"><ellipse cx="250" cy="250" rx="42" ry="11"/><ellipse cx="272" cy="241" rx="26" ry="13"/><ellipse cx="228" cy="243" rx="20" ry="9"/></g>
    <g class="cl cl3" fill="#fff" opacity=".7"><ellipse cx="60" cy="350" rx="38" ry="10"/><ellipse cx="84" cy="342" rx="22" ry="11"/></g>

<script>
(function () {
  var KEY = 'housework-v3', OLD = 'housework-v2', UIKEY = 'housework-ui';
  var DEFAULTS = ['빨래', '화장실 청소', '침구 세탁', '바닥 청소기', '쓰레기통 비우기', '냉장고 정리', '설거지 · 싱크대 청소'];
  var WD = ['일', '월', '화', '수', '목', '금', '토'];
  var mem = null, toastTimer = null;

  function iso(d) {
    var m = d.getMonth() + 1, day = d.getDate();
    return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
  }
  function parse(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function today() { var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function fmt(s) { var d = parse(s); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + WD[d.getDay()] + ')'; }

  // state: { next, mode:'month'|'week', names:[suggestions], days:{ 'YYYY-MM-DD': [{id,name,done}] } }
  function fresh() { return { next: 1, mode: 'month', names: DEFAULTS.slice(), days: {} }; }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) return JSON.parse(raw);
      var old = localStorage.getItem(OLD);   // v2: 전역 집안일 목록 + 날짜별 완료 id → 날짜별 '완료' 항목으로 옮김
      if (old) {
        var o = JSON.parse(old), s = fresh(), byId = {};
        s.names = o.chores.map(function (c) { byId[c.id] = c.name; return c.name; });
        Object.keys(o.days).forEach(function (d) {
          var arr = [];
          o.days[d].forEach(function (id) { if (byId[id]) arr.push({ id: s.next++, name: byId[id], done: true }); });
          if (arr.length) s.days[d] = arr;
        });
        return s;
      }
    } catch (e) {}
    return mem || fresh();
  }
  var state = load();
  var sel = iso(today());

  function save() {
    mem = state;
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 2000);
  }

  function tasks(s) { return state.days[s] || []; }
  function setTasks(s, arr) { if (arr.length) state.days[s] = arr; else delete state.days[s]; }
  // none / open(전부 미완료) / part(일부 완료) / done(전부 완료)
  function stat(s) {
    var t = tasks(s), n = t.filter(function (x) { return x.done; }).length;
    return !t.length ? 'none' : n === t.length ? 'done' : n ? 'part' : 'open';
  }
  function lastDone(name) {
    var best = null;
    Object.keys(state.days).forEach(function (d) {
      if (d < sel && (!best || d > best) && state.days[d].some(function (x) { return x.name === name && x.done; })) best = d;
    });
    return best;
  }
  function lastText(name) {
    var l = lastDone(name);
    if (!l) return '이전 완료 기록 없음';
    var n = Math.round((parse(sel) - parse(l)) / 86400000);
    return '마지막 ' + (n === 1 ? '하루 전' : n + '일 전') + ' 완료 · ' + fmt(l);
  }

  /* ---------- calendar ---------- */
  function dayClass(d, s) {
    var dow = d.getDay();
    return (dow === 0 ? ' sun' : dow === 6 ? ' sat' : '') + (s === iso(today()) ? ' today' : '') + (s === sel ? ' sel' : '') + ' ' + stat(s);
  }
  function label(s) {
    var t = tasks(s), n = t.filter(function (x) { return x.done; }).length;
    return fmt(s) + (t.length ? ', ' + t.length + '개 중 ' + n + '개 완료' : ', 집안일 없음');
  }
  function choose(s) { sel = s; render(); openSheet('day'); }

  function renderMonth(body, c) {
    var dows = el('div', 'dows'), grid = el('div', 'grid');
    WD.forEach(function (w) { dows.appendChild(el('div', 'dow', w)); });
    body.appendChild(dows);
    var first = new Date(c.getFullYear(), c.getMonth(), 1);
    var len = new Date(c.getFullYear(), c.getMonth() + 1, 0).getDate();
    for (var b = 0; b < first.getDay(); b++) grid.appendChild(el('div', 'day blank'));
    for (var n = 1; n <= len; n++) {
      var d = new Date(c.getFullYear(), c.getMonth(), n), s = iso(d), t = tasks(s);
      var btn = el('button', 'day' + dayClass(d, s));
      btn.type = 'button';
      btn.setAttribute('aria-label', label(s));
      btn.appendChild(el('span', 'num', String(n)));
      var dots = el('span', 'dots');
      t.slice(0, 4).forEach(function (x) { dots.appendChild(el('i', x.done ? 'd' : '')); });
      btn.appendChild(dots);
      (function (s2) { btn.addEventListener('click', function () { choose(s2); }); })(s);
      grid.appendChild(btn);
    }
    body.appendChild(grid);
  }

  function renderWeek(body, c) {
    var start = addDays(c, -c.getDay()), wrap = el('div', 'week');
    for (var i = 0; i < 7; i++) {
      var d = addDays(start, i), s = iso(d), t = tasks(s);
      var row = el('button', 'wrow' + dayClass(d, s));
      row.type = 'button';
      row.setAttribute('aria-label', label(s));
      var dt = el('div', 'wdate');
      dt.appendChild(el('b', null, String(d.getDate())));
      dt.appendChild(el('span', null, WD[d.getDay()]));
      row.appendChild(dt);
      var chips = el('div', 'chips');
      if (!t.length) chips.appendChild(el('span', 'none', '집안일 없음'));
      t.forEach(function (x) { chips.appendChild(el('span', 'chip' + (x.done ? ' d' : ''), x.name)); });
      row.appendChild(chips);
      (function (s2) { row.addEventListener('click', function () { choose(s2); }); })(s);
      wrap.appendChild(row);
    }
    body.appendChild(wrap);
  }

  function renderCal() {
    var c = parse(sel), body = document.getElementById('calBody');
    body.textContent = '';
    document.getElementById('mWeek').setAttribute('aria-pressed', state.mode === 'week');
    document.getElementById('mMonth').setAttribute('aria-pressed', state.mode === 'month');
    if (state.mode === 'month') {
      document.getElementById('calTitle').textContent = c.getFullYear() + '년 ' + (c.getMonth() + 1) + '월';
      renderMonth(body, c);
    } else {
      var a = addDays(c, -c.getDay()), z = addDays(a, 6);
      document.getElementById('calTitle').textContent = (a.getMonth() + 1) + '월 ' + a.getDate() + '일 – ' + (z.getMonth() === a.getMonth() ? '' : (z.getMonth() + 1) + '월 ') + z.getDate() + '일';
      renderWeek(body, c);
    }
  }

  // 이전/다음: 월 보기는 한 달, 주 보기는 7일 이동 (선택 날짜도 같이 이동해서 항상 화면 안에 있게)
  function shift(n) {
    var c = parse(sel);
    if (state.mode === 'week') { sel = iso(addDays(c, n * 7)); }
    else {
      var y = c.getFullYear(), m = c.getMonth() + n, last = new Date(y, m + 1, 0).getDate();
      sel = iso(new Date(y, m, Math.min(c.getDate(), last)));
    }
    render();
  }
  function setMode(m) { state.mode = m; save(); render(); }

  /* ---------- bottom sheets ---------- */
  var sheets = { day: document.getElementById('daySheet'), skin: document.getElementById('skinSheet') };
  var scrim = document.getElementById('scrim'), current = null;
  function openSheet(name) {
    if (current) return;
    current = name;
    sheets[name].classList.add('open'); scrim.classList.add('open');
    scrim.classList.toggle('lite', name === 'skin');
    document.body.style.overflow = 'hidden';
    sheets[name].scrollTop = 0;
    try { history.pushState({ sheet: 1 }, ''); } catch (e) {}   // 안드로이드 뒤로가기 버튼으로 시트만 닫히게
  }
  function closeSheet(fromPop) {
    if (!current) return;
    sheets[current].classList.remove('open'); scrim.classList.remove('open');
    current = null;
    document.body.style.overflow = '';
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    if (fromPop !== true && history.state && history.state.sheet) history.back();
  }
  window.addEventListener('popstate', function () { closeSheet(true); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });
  scrim.addEventListener('click', function () { closeSheet(); });
  Array.prototype.forEach.call(document.querySelectorAll('[data-close]'), function (b) { b.addEventListener('click', function () { closeSheet(); }); });
  document.getElementById('prevDay').addEventListener('click', function () { sel = iso(addDays(parse(sel), -1)); render(); });
  document.getElementById('nextDay').addEventListener('click', function () { sel = iso(addDays(parse(sel), 1)); render(); });

  /* ---------- selected day ---------- */
  function renderDay() {
    var t = tasks(sel), done = t.filter(function (x) { return x.done; }).length;
    document.getElementById('dayTitle').textContent = (sel === iso(today()) ? '오늘 · ' : '') + fmt(sel);
    document.getElementById('dayCount').textContent = t.length ? done + '/' + t.length + ' 완료' : '집안일 없음';
    document.getElementById('barFill').style.width = (t.length ? Math.round(done / t.length * 100) : 0) + '%';
    var list = document.getElementById('list');
    list.textContent = '';
    if (!t.length) list.appendChild(el('li', 'empty', '이 날 할 집안일을 아래에서 추가해 보세요.'));
    t.forEach(function (x) {
      var li = el('li', 'item');
      var b = el('button', 'check');
      b.type = 'button';
      b.setAttribute('aria-pressed', x.done ? 'true' : 'false');
      b.appendChild(el('span', 'box', '✓'));
      var tx = el('span', 'txt');
      tx.appendChild(el('div', 'name', x.name));
      tx.appendChild(el('div', 'last', x.done ? '완료 · 다시 누르면 취소' : lastText(x.name)));
      b.appendChild(tx);
      b.addEventListener('click', function () { x.done = !x.done; save(); render(); });
      li.appendChild(b);
      var del = el('button', 'del', '✕');
      del.type = 'button';
      del.setAttribute('aria-label', x.name + ' 삭제');
      del.addEventListener('click', function () {
        if (!del.classList.contains('sure')) {
          del.classList.add('sure'); del.textContent = '삭제';
          setTimeout(function () { del.classList.remove('sure'); del.textContent = '✕'; }, 2500);
          return;
        }
        setTasks(sel, tasks(sel).filter(function (y) { return y.id !== x.id; }));

  applySkin(ui.skin, false);

  render();

  // 앱을 다시 열었을 때(자정 지남 등) 오늘 날짜 표시를 갱신
  document.body.dataset.day = iso(today());
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && iso(today()) !== document.body.dataset.day) {

      render();
    }
